name: Deploy to npm

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Use the temporary token for a verified first release
        type: boolean
        default: false
  release:
    types:
      - published
  workflow_run:
    workflows:
      - Create GitHub Release
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build, test, and publish packages
    if: ${{ ((github.event_name == 'workflow_dispatch' && inputs.bootstrap && github.ref == 'refs/heads/main') || vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true') && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: npm
    timeout-minutes: 15
    steps:
      - name: 1. Checkout source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: 2. Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.21.0'
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false


      - name: 3. Show run context
        env:
          UPSTREAM_WORKFLOW: ${{ github.event.workflow_run.name || '' }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion || '' }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          echo "::group::GitHub context"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Upstream workflow: ${UPSTREAM_WORKFLOW}"
          echo "Upstream conclusion: ${UPSTREAM_CONCLUSION}"
          echo "Upstream branch: ${UPSTREAM_BRANCH}"
          echo "Upstream SHA: ${UPSTREAM_SHA}"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Repository private: ${REPOSITORY_PRIVATE}"
          echo "Ref: $GITHUB_REF"
          echo "SHA: $GITHUB_SHA"
          echo "Actor: $GITHUB_ACTOR"
          echo "Workflow: $GITHUB_WORKFLOW"
          echo "Run id: $GITHUB_RUN_ID"
          echo "Run attempt: $GITHUB_RUN_ATTEMPT"
          echo "Environment: npm"
          echo "::endgroup::"

          echo "::group::Runtime context"
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          echo "Working directory: $PWD"
          echo "Git commit: $(git rev-parse HEAD)"
          echo "Git branch: $(git branch --show-current || true)"
          echo "::endgroup::"

          echo "::group::npm config"
          echo "registry=$(npm config get registry)"
          echo "userconfig=$(npm config get userconfig)"
          echo "cache=$(npm config get cache)"
          echo "::endgroup::"

          if [ "${REPOSITORY_PRIVATE}" = "true" ]; then
            echo "::error::This publish workflow is configured for public repositories. Make the repository public or remove this guard before publishing."
            exit 1
          fi

      - name: 4. Show workspace metadata
        run: node scripts/publish-workspaces.js --check

      - name: 5. Check SemVer policy
        run: npm run check:semver

      - name: 6. Check npm versions
        id: npm_versions
        run: node scripts/publish-workspaces.js --check --github-output "$GITHUB_OUTPUT"

      - name: 7. Show npm version check outputs
        run: |
          echo "Checked packages: ${{ steps.npm_versions.outputs.checked_count }}"
          echo "Registry: ${{ steps.npm_versions.outputs.registry }}"
          echo "Unpublished count: ${{ steps.npm_versions.outputs.unpublished_count }}"
          echo "Unpublished packages: ${{ steps.npm_versions.outputs.unpublished }}"

      - name: 8. Install clean dependencies
        if: steps.npm_versions.outputs.unpublished_count != '0'
        run: |
          echo "::group::npm ci"
          npm ci --ignore-scripts
          npm audit --audit-level=high
          echo "::endgroup::"

          echo "::group::Installed workspace dependency tree"
          npm ls --workspaces --depth=0 || true
          echo "::endgroup::"

      - name: 9. Run tests
        if: steps.npm_versions.outputs.unpublished_count != '0'
        run: npm test

      - name: 11. Preview npm package contents
        if: steps.npm_versions.outputs.unpublished_count != '0'
        run: |
          echo "::group::npm pack dry run"
          npm pack --workspaces --dry-run
          echo "::endgroup::"

      - name: 12. Publish to npm
        if: steps.npm_versions.outputs.unpublished_count != '0'
        run: node scripts/publish-workspaces.js --publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ inputs.bootstrap && secrets.NPM_BOOTSTRAP_TOKEN || '' }}

      - name: 13. Verify published packages
        if: steps.npm_versions.outputs.unpublished_count != '0'
        run: node scripts/publish-workspaces.js --verify

      - name: 14. Write deploy summary
        if: always()
        run: |
          {
            echo "## npm Deploy Pipeline"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Ref | \`${{ github.ref }}\` |"
            echo "| SHA | \`${{ github.sha }}\` |"
            echo "| Registry | \`${{ steps.npm_versions.outputs.registry }}\` |"
            echo "| Checked packages | \`${{ steps.npm_versions.outputs.checked_count }}\` |"
            echo "| Unpublished packages before deploy | \`${{ steps.npm_versions.outputs.unpublished_count }}\` |"
            echo "| Pending package names | \`${{ steps.npm_versions.outputs.unpublished }}\` |"
            echo ""
            if [ "${{ steps.npm_versions.outputs.unpublished_count }}" = "0" ]; then
              echo "Result: skipped because all workspace package versions already exist on npm."
            else
              echo "Result: publish attempted with GitHub OIDC. Check the pack, publish, and verification steps for details."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
